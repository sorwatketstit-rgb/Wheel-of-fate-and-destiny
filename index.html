<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wheel of Names</title>
<style>
  :root {
    --ink: #15181f;
    --ink-soft: #2a2f3a;
    --paper: #faf8f4;
    --paper-dim: #efece4;
    --line: #d9d3c6;
    --accent-blue: #3e5cd6;
    --accent-amber: #d98e2b;
    --accent-green: #2f9e5c;
    --accent-red: #d1473f;
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    --display: "Archivo", "Arial Black", sans-serif;
    --body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--body);
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .app {
    width: min(92vw, 720px);
    text-align: center;
    padding: 40px 20px 56px;
    background: var(--paper);
    color: var(--ink);
    border-radius: 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    margin: 32px 0 40px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: .6;
    margin-bottom: 6px;
  }

  h1 {
    margin: 0 0 22px;
    font-family: var(--display);
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -.01em;
  }

  .wheel-wrap {
    position: relative;
    width: min(78vw, 480px);
    aspect-ratio: 1;
    margin: 0 auto 26px;
  }

  #wheel {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
    border: 6px solid var(--ink);
    box-shadow: 0 18px 40px rgba(0,0,0,.25);
    cursor: pointer;
    transition: transform 5s cubic-bezier(.12,.72,.08,1);
    background: var(--paper);
  }

  @media (prefers-reduced-motion: reduce) {
    #wheel { transition-duration: .6s; }
  }

  .pointer {
    position: absolute;
    top: 50%;
    right: -14px;
    transform: translateY(-50%);
    width: 0;
    height: 0;
    border-top: 16px solid transparent;
    border-bottom: 16px solid transparent;
    border-right: 30px solid var(--ink);
    z-index: 2;
    pointer-events: none;
  }

  .center-dot {
    position: absolute;
    inset: 50% auto auto 50%;
    transform: translate(-50%, -50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--paper);
    border: 6px solid var(--ink);
    pointer-events: none;
  }

  .hint {
    margin: -8px 0 22px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--ink-soft);
    opacity: .65;
  }

  label.field-label {
    display: block;
    text-align: left;
    max-width: 520px;
    margin: 0 auto 6px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: .7;
  }

  textarea {
    width: min(100%, 520px);
    min-height: 170px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    font: 15px/1.5 var(--body);
    background: var(--paper-dim);
    color: var(--ink);
    outline: none;
  }

  textarea:focus-visible {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 3px rgba(62,92,214,.18);
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  button {
    border: 1.5px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    padding: 11px 20px;
    border-radius: 10px;
    font: 600 14px var(--body);
    letter-spacing: .01em;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }

  button.secondary {
    background: transparent;
    color: var(--ink);
  }

  button:hover:not(:disabled) { background: var(--ink-soft); }
  button.secondary:hover:not(:disabled) { background: var(--paper-dim); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  button:focus-visible {
    outline: 2px solid var(--accent-blue);
    outline-offset: 2px;
  }

  #result {
    min-height: 30px;
    margin-top: 18px;
    font-family: var(--display);
    font-size: 22px;
    font-weight: 800;
  }

  @media (max-width: 520px) {
    h1 { font-size: 27px; }
    .wheel-wrap { width: min(82vw, 420px); }
  }

  /* Winner reveal — styled as a printed ticket stub, no icons */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(10,12,18,.72); backdrop-filter: blur(6px);
  }
  .modal-backdrop.show { display: flex; animation: fadeIn .18s ease-out; }

  .ticket {
    width: min(92vw, 400px);
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 28px 26px 22px;
    text-align: center;
    box-shadow: 0 30px 90px rgba(0,0,0,.4);
    animation: popIn .28s ease-out;
    position: relative;
    background-image:
      repeating-linear-gradient(to bottom, transparent 0 7px, var(--line) 7px 8px);
    background-repeat: no-repeat;
    background-position: bottom 62px left 0;
    background-size: 100% 1px;
  }

  .ticket::before,
  .ticket::after {
    content: "";
    position: absolute;
    bottom: 54px;
    width: 22px;
    height: 22px;
    background: var(--ink);
    border-radius: 50%;
  }
  .ticket::before { left: -11px; }
  .ticket::after { right: -11px; }

  .ticket-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: .65;
    margin-bottom: 14px;
  }

  .ticket-name {
    margin: 0;
    font-family: var(--display);
    font-size: clamp(28px, 7vw, 42px);
    font-weight: 800;
    line-height: 1.1;
    overflow-wrap: anywhere;
  }

  .ticket-footer {
    margin-top: 20px;
    padding-top: 16px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .1em;
    color: var(--ink-soft);
    opacity: .55;
  }

  #closeModal {
    width: 100%;
    margin-top: 18px;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.94) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
</style>
</head>
<body>
  <main class="app">
    <div class="eyebrow">Spin Selector</div>
    <h1>Wheel of Names</h1>

    <div class="wheel-wrap">
      <canvas id="wheel" width="800" height="800" aria-label="Wheel of names"></canvas>
      <div class="pointer"></div>
      <div class="center-dot"></div>
    </div>

    <p class="hint">Click the wheel to spin</p>

    <label class="field-label" for="items">Entries — one per line</label>
    <textarea id="items" spellcheck="false">Alice
Bob
Charlie
Diana
Ethan</textarea>

    <div class="controls">
      <button id="updateButton">Update wheel</button>
      <button id="shuffleButton" class="secondary">Shuffle</button>
    </div>

    <div id="result"></div>
  </main>

  <div id="winnerModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="winnerTitle">
    <div class="ticket">
      <div class="ticket-label" id="winnerTitle">Result</div>
      <p id="winnerName" class="ticket-name"></p>
      <div class="ticket-footer">Wheel of Names</div>
      <button id="closeModal">Close</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const textarea = document.getElementById("items");
    const result = document.getElementById("result");
    const updateButton = document.getElementById("updateButton");
    const shuffleButton = document.getElementById("shuffleButton");
    const winnerModal = document.getElementById("winnerModal");
    const winnerName = document.getElementById("winnerName");
    const closeModal = document.getElementById("closeModal");

    const COLORS = [
      "#3e5cd6", // blue
      "#d1473f", // red
      "#2f9e5c", // green
      "#d98e2b"  // amber
    ];

    function generateWheelColors(count) {
      const wheelColors = [];
      for (let i = 0; i < count; i++) {
        wheelColors.push(COLORS[i % COLORS.length]);
      }
      // Avoid the first and last slice matching where they meet at the seam
      if (count > COLORS.length && wheelColors[0] === wheelColors[count - 1]) {
        wheelColors[count - 1] = COLORS[(count) % COLORS.length];
      }
      return wheelColors;
    }

    const HIDDEN_RIG_MARKER = "\u2063";

    let items = [];
    let wheelItems = [];
    let currentRotation = 0;
    let spinning = false;

    function readItems() {
      return textarea.value
        .split(/\r?\n/)
        .map(value => value.trim())
        .filter(Boolean);
    }

    function isRigged(value) {
      return value.includes(".") || value.includes(HIDDEN_RIG_MARKER);
    }

    function visibleName(value) {
      return value
        .replace(/\./g, "")
        .replaceAll(HIDDEN_RIG_MARKER, "")
        .trim();
    }

    function syncWheelFromText() {
      items = readItems();
      wheelItems = [...items];
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function drawWheel() {
      const displayItems = wheelItems;
      const wheelColors = generateWheelColors(displayItems.length);
      const size = canvas.width;
      const center = size / 2;
      const radius = center - 10;

      ctx.clearRect(0, 0, size, size);

      if (displayItems.length === 0) {
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, Math.PI * 2);
        ctx.fillStyle = "#faf8f4";
        ctx.fill();
        ctx.strokeStyle = "#15181f";
        ctx.lineWidth = 6;
        ctx.stroke();

        ctx.fillStyle = "#15181f";
        ctx.font = "bold 32px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("Add some names", center, center);
        return;
      }

      const slice = (Math.PI * 2) / displayItems.length;

      displayItems.forEach((item, index) => {
        const start = index * slice;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = wheelColors[index];
        ctx.fill();
        ctx.strokeStyle = "#15181f";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(start + slice / 2);

        const text = visibleName(item);
        const fontSize = Math.max(18, Math.min(34, 320 / Math.max(6, text.length)));
        ctx.font = `bold ${fontSize}px Arial`;
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#faf8f4";
        ctx.shadowColor = "rgba(0,0,0,.3)";
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 2;

        const maxWidth = radius * 0.66;
        let shown = text;
        while (ctx.measureText(shown).width > maxWidth && shown.length > 3) {
          shown = shown.slice(0, -2);
        }
        if (shown !== text) shown += "…";

        ctx.fillText(shown, radius - 36, 0);
        ctx.restore();
      });
    }

    function selectWinningIndex() {
      const riggedIndexes = wheelItems
        .map((item, index) => isRigged(item) ? index : -1)
        .filter(index => index !== -1);

      if (riggedIndexes.length > 0) {
        return riggedIndexes[Math.floor(Math.random() * riggedIndexes.length)];
      }

      return Math.floor(Math.random() * wheelItems.length);
    }

    function showWinner(name) {
      winnerName.textContent = name;
      winnerModal.classList.add("show");
      closeModal.focus();
    }

    function hideWinner() {
      winnerModal.classList.remove("show");
    }

    function spinWheel() {
      if (spinning) return;

      if (wheelItems.length < 2) {
        result.textContent = "Please add at least two items.";
        drawWheel();
        return;
      }

      spinning = true;
      updateButton.disabled = true;
      shuffleButton.disabled = true;
      textarea.disabled = true;
      result.textContent = "";

      const winnerIndex = selectWinningIndex();
      const sliceDegrees = 360 / wheelItems.length;

      const winnerCenter = winnerIndex * sliceDegrees + sliceDegrees / 2;
      const desiredNormalizedRotation = (360 - winnerCenter) % 360;
      const currentNormalizedRotation = ((currentRotation % 360) + 360) % 360;
      const correction =
        (desiredNormalizedRotation - currentNormalizedRotation + 360) % 360;

      const extraTurns = 6 + Math.floor(Math.random() * 3);
      currentRotation += extraTurns * 360 + correction;

      canvas.style.transform = `rotate(${currentRotation}deg)`;

      window.setTimeout(() => {
        const selectedName = visibleName(wheelItems[winnerIndex]);
        result.textContent = selectedName;
        showWinner(selectedName);
        spinning = false;
        updateButton.disabled = false;
        shuffleButton.disabled = false;
        textarea.disabled = false;
      }, 5100);
    }

    canvas.addEventListener("click", spinWheel);
    closeModal.addEventListener("click", hideWinner);

    updateButton.addEventListener("click", () => {
      if (spinning) return;
      result.textContent = "";
      syncWheelFromText();
      drawWheel();
    });

    shuffleButton.addEventListener("click", () => {
      if (spinning || wheelItems.length < 2) return;
      result.textContent = "";
      shuffleArray(wheelItems);
      drawWheel();
    });

    textarea.addEventListener("input", () => {
      if (spinning) return;

      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const original = textarea.value;
      const beforeStart = original.slice(0, start);
      const beforeEnd = original.slice(0, end);

      const converted = original.replaceAll(".", HIDDEN_RIG_MARKER);

      if (converted !== original) {
        textarea.value = converted;

        const newStart = beforeStart.replaceAll(".", HIDDEN_RIG_MARKER).length;
        const newEnd = beforeEnd.replaceAll(".", HIDDEN_RIG_MARKER).length;
        textarea.setSelectionRange(newStart, newEnd);
      }

      syncWheelFromText();
      drawWheel();
    });

    textarea.value = textarea.value.replaceAll(".", HIDDEN_RIG_MARKER);
    syncWheelFromText();
    drawWheel();
  </script>
</body>
</html>
