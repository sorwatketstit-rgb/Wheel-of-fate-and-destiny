<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wheel of Names</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <div class="eyebrow">Spin Selector</div>
        <h1>Wheel of Names</h1>
      </div>
      <button id="themeToggle" class="secondary toggle-btn" aria-label="Toggle theme"></button>
    </header>
    <div class="content-grid">
      <section class="wheel-section">
        <div class="wheel-wrap">
          <canvas id="wheel" width="800" height="800" aria-label="Wheel of names"></canvas>
          <div class="pointer"></div>
          <div class="center-dot"></div>
        </div>
        <p class="hint">Click the wheel to spin</p>
      </section>
      <section class="controls-section">
        <label class="field-label" for="items">Entries — one per line</label>
        <textarea id="items" spellcheck="false">Alice
Bob
Charlie
Diana
Ethan</textarea>
        <div class="controls">
          <button id="updateButton" class="primary">Update Wheel</button>
          <button id="shuffleButton" class="secondary">Shuffle</button>
        </div>
        <div id="result"></div>
      </section>
    </div>
  </main>
  <div id="winnerModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="winnerTitle">
    <div class="ticket">
      <div class="ticket-label" id="winnerTitle">Winner</div>
      <p id="winnerName" class="ticket-name"></p>
      <div class="ticket-footer">Wheel of Names</div>
      <button id="closeModal" class="primary">Close</button>
    </div>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
